name: Tests

# The test suite. It only reports: a red run here never stops the leaderboards
# (that is the separate "Leaderboards" workflow). Nothing in the suite touches
# the real Discord or the real data - see tests/lib/harness.js.

on:
  push:
    paths:
      - "scripts/**"
      - "mirror/**"
      - "tests/**"
      - "config.json"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the suite
        run: node tests/run.js
